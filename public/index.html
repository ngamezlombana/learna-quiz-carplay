<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Learna AI English Quiz · Web & Apple CarPlay</title>
  
  <!-- Favicon & PWA Icons -->
  <link rel="icon" type="image/png" href="/assets/images/personalize/ai-tutor-head-x.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Learna CarPlay">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              base: '#1A47B8',
              50: '#F0F7FF',
              100: '#E1EFFF',
              200: '#C4DFFF',
              600: '#153791',
              sub: '#0B192C'
            }
          }
        }
      }
    }
  </script>

  <!-- Lottie Web Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="h-full flex flex-col justify-between transition-colors duration-300">

  <!-- Top App Navigation Bar -->
  <header class="w-full bg-white/95 backdrop-blur border-b border-neutral-200 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between gap-4">
      
      <!-- Back Button -->
      <button id="back-btn" class="w-9 h-9 rounded-full hover:bg-neutral-100 flex items-center justify-center text-neutral-700 transition-colors" title="Atrás" style="visibility: hidden;">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <!-- Center Progress Bar -->
      <div class="flex-1 max-w-md flex flex-col gap-1">
        <div class="w-full bg-neutral-200 h-2 rounded-full overflow-hidden">
          <div id="progress-bar" class="bg-primary-base h-full rounded-full transition-all duration-300 ease-out" style="width: 5%;"></div>
        </div>
      </div>

      <!-- Controls: Dialogue, Voice, Language, Mode -->
      <div class="flex items-center gap-2">
        <!-- Direct Jump to Conversational AI Dialogue -->
        <button id="dialogue-toggle-btn" class="px-2.5 py-1.5 rounded-lg border border-primary-200 bg-primary-50 text-xs font-bold text-primary-base hover:bg-primary-100 active:scale-95 transition-all flex items-center gap-1.5 shadow-sm" title="Ir directo al Diálogo Conversacional con diferentes acentos">
          <span>🗣️</span>
          <span class="hidden sm:inline">Diálogo IA</span>
        </button>

        <!-- Voice Assistant Toggle -->
        <button id="voice-toggle-btn" class="px-2.5 py-1.5 rounded-lg border border-neutral-200 bg-white text-xs font-bold text-neutral-700 hover:bg-neutral-50 active:scale-95 transition-all flex items-center gap-1.5" title="Activar/Desactivar lectura en voz alta">
          <span>🔇</span>
          <span class="hidden sm:inline">Voz</span>
        </button>

        <!-- Language Switcher -->
        <button id="lang-toggle-btn" class="px-2.5 py-1.5 rounded-lg border border-neutral-200 bg-white text-xs font-bold text-neutral-700 hover:bg-neutral-50 active:scale-95 transition-all" title="Cambiar idioma">
          🇪🇸 ES
        </button>

        <!-- Apple CarPlay Switcher -->
        <button id="mode-toggle-btn" class="px-3 py-1.5 rounded-lg bg-neutral-900 text-white text-xs font-bold shadow hover:bg-neutral-800 active:scale-95 transition-all flex items-center gap-1.5" title="Alternar simulación Apple CarPlay">
          <span>🚗</span>
          <span class="hidden sm:inline">Apple CarPlay</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Content Area -->
  <main id="app-container" class="flex-1 w-full max-w-4xl mx-auto px-4 py-6 flex flex-col justify-center items-center">
    <!-- Step Container -->
    <div id="step-content" class="w-full">
      <!-- Injected by app.js -->
    </div>
  </main>

  <!-- Bottom Brand Footer -->
  <footer class="w-full py-3 text-center border-t border-neutral-100 bg-white/50 text-[11px] text-neutral-400">
    <span>Learna AI English Quiz · Reverse Engineered with REA · Compatible with Apple CarPlay</span>
  </footer>

  <!-- App Script -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
